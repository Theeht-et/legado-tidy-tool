name: bootstrap-glue

# 一次性：把参考项目的平台补全层拉进 vendor/glue/ 并提交。
# 跑完就把本 workflow 删掉（代码已进仓库，不再依赖 gitee）。

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/bootstrap-glue.py'
      - '.github/workflows/bootstrap-glue.yml'

permissions:
  contents: write

jobs:
  glue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 拉取平台补全层
        run: python3 scripts/bootstrap-glue.py

      - name: 回写
        run: |
          set -e
          if [ -z "$(git status --porcelain vendor/glue)" ]; then
            echo "vendor/glue 无变化，跳过提交"
            exit 0
          fi
          COUNT=$(git status --porcelain vendor/glue | wc -l)
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add vendor/glue
          git commit -m "chore(glue): 导入平台补全层起点代码（${COUNT} 个文件）"
          git push
