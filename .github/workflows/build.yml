name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

# 同一 PR / 分支有新提交时，取消旧运行，只保留最新提交的构建。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# contents: write 只为了让失败现场能推到 ci-artifacts 分支（见最后一步），
# 正常构建不需要写权限。
permissions:
  contents: write

jobs:
  test:
    name: 编译与单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      # vendor/legado 与 vendor/glue 的源码都在仓库里，CI 不联网拉源码。
      # 只有两样东西不进仓库，用脚本从上游拿：
      #   1) htmlunit-core-js 的 jar（1.9MB 二进制，MCP/网页都推不进去）
      #   2) CryptoJS（64KB 压缩脚本，进仓库会污染每次 grep 与 review）
      - name: 补齐 Rhino jar 与运行期 JS 资源
        run: |
          python3 scripts/fetch-engine-jar.py
          python3 scripts/fetch-assets.py

      - name: 校验 vendor 完整性
        run: |
          python3 scripts/vendor-upstream.py --check
          python3 scripts/bootstrap-glue.py --check

      - name: 单测
        run: |
          gradle :core:test --console=plain
          gradle :engine:test --console=plain
          gradle :desktop:test --console=plain

      - name: 编译全模块
        run: gradle build -x test --console=plain

      # 失败时把现场推到一个不保护的分支上，不用登录网页看日志也能定位。
      # 推 ci-artifacts 而不是 main：main 上不该出现这种文件。
      - name: 失败现场
        if: failure()
        run: |
          {
            echo "# CI 失败现场（$(date -u +%Y-%m-%dT%H:%M:%SZ)）"
            echo
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo
            found=0
            for f in $(find . -path '*/build/test-results/*' -name '*.xml' 2>/dev/null); do
              if grep -q '<failure' "$f" 2>/dev/null; then
                found=1
                echo "## $f"
                echo '```'
                sed -n '/<failure/,/<\/failure>/p' "$f" | head -60
                echo '```'
                echo
              fi
            done
            if [ "$found" = "0" ]; then
              echo "没有测试失败记录，说明挂在编译或其他步骤。"
              echo
              echo '```'
              ls -R */build/test-results 2>/dev/null | head -40
              echo '```'
            fi
          } > CI-FAILURE.md
          cat CI-FAILURE.md | head -80
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f CI-FAILURE.md
          git commit -m "ci: 失败现场" || exit 0
          git push origin HEAD:refs/heads/ci-artifacts --force

  windows-exe:
    name: Windows 原生 EXE
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: 补齐 Rhino jar 与运行期 JS 资源
        shell: pwsh
        env:
          # Windows runner 的 Python 默认控制台编码可能是 cp1252，无法输出脚本中的中文日志。
          PYTHONUTF8: '1'
        run: |
          python scripts/fetch-engine-jar.py
          python scripts/fetch-assets.py

      - name: 生成 Windows 原生 EXE 应用目录
        run: gradle :desktop:windowsAppImage --console=plain

      - name: 验证原生 EXE、Skiko 资源去重与启动
        shell: pwsh
        run: |
          $bundle = Join-Path $PWD 'desktop\build\windows-app-image\legado-tidy'
          $exe = Join-Path $bundle 'legado-tidy.exe'
          $appDir = Join-Path $bundle 'app'
          $config = Join-Path $appDir 'legado-tidy.cfg'
          $modules = Join-Path $bundle 'runtime\lib\modules'

          foreach ($path in @($exe, $config, $modules)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Windows app-image 缺少必要文件：$path"
            }
          }

          if ((Get-Content -LiteralPath $config -Raw) -notmatch 'skiko\.library\.path=.*APPDIR') {
            throw 'jpackage 启动配置没有把 Skiko 原生库路径指向 app 目录。'
          }

          $skikoJars = @(Get-ChildItem -LiteralPath $appDir -Filter 'skiko*.jar' -File)
          if ($skikoJars.Count -eq 0) {
            throw '应用目录缺少 Skiko JAR。'
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($jar in $skikoJars) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
            try {
              $duplicates = @($zip.Entries | Where-Object {
                $_.FullName -match '^[^/]+\.(dll|dat)$'
              })
              if ($duplicates.Count -gt 0) {
                throw "Skiko JAR 仍含有重复的顶层原生资源：$($jar.Name): $($duplicates.FullName -join ', ')"
              }
            } finally {
              $zip.Dispose()
            }
          }

          if (-not (Test-Path -LiteralPath (Join-Path $appDir 'skiko-windows-x64.dll'))) {
            throw '应用目录缺少提取后的 skiko-windows-x64.dll。'
          }
          if (-not (Test-Path -LiteralPath (Join-Path $appDir 'icudtl.dat'))) {
            throw '应用目录缺少提取后的 icudtl.dat。'
          }

          $launchScripts = @(Get-ChildItem -LiteralPath $bundle -Recurse -File |
            Where-Object { $_.Extension -in @('.bat', '.cmd', '.vbs') })
          if ($launchScripts.Count -gt 0) {
            throw "应用目录仍包含旧启动脚本：$($launchScripts.FullName -join ', ')"
          }

          # 将整套程序复制到带空格的路径，验证原生启动器不依赖当前工作目录或无空格路径。
          $testRoot = Join-Path $env:RUNNER_TEMP 'legado tidy exe smoke test'
          if (Test-Path -LiteralPath $testRoot) {
            Remove-Item -LiteralPath $testRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $testRoot | Out-Null
          Copy-Item -Path (Join-Path $bundle '*') -Destination $testRoot -Recurse
          $testExe = Join-Path $testRoot 'legado-tidy.exe'

          $process = Start-Process -FilePath $testExe -WorkingDirectory $testRoot -PassThru
          try {
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) {
              throw "原生 GUI 启动后提前退出，ExitCode=$($process.ExitCode)"
            }
            Write-Host '原生 GUI 已保持运行 10 秒，启动冒烟测试通过。'
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      # app-image 是完整的免安装应用目录；下载后解压并双击 legado-tidy.exe。
      - uses: actions/upload-artifact@v4
        with:
          name: legado-tidy-windows-x64
          path: desktop/build/windows-app-image/legado-tidy/
          retention-days: 7
