name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

# contents: write 只为了让失败现场能推到 ci-artifacts 分支（见最后一步），
# 正常构建不需要写权限。
permissions:
  contents: write

jobs:
  test:
    name: 编译与单测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      # vendor/legado 与 vendor/glue 的源码都在仓库里，CI 不联网拉源码。
      # 只有两样东西不进仓库，用脚本从上游拿：
      #   1) htmlunit-core-js 的 jar（1.9MB 二进制，MCP/网页都推不进去）
      #   2) CryptoJS（64KB 压缩脚本，进仓库会污染每次 grep 与 review）
      - name: 补齐 Rhino jar 与运行期 JS 资源
        run: |
          python3 scripts/fetch-engine-jar.py
          python3 scripts/fetch-assets.py

      - name: 校验 vendor 完整性
        run: |
          python3 scripts/vendor-upstream.py --check
          python3 scripts/bootstrap-glue.py --check

      - name: 单测
        run: |
          gradle :core:test --console=plain
          gradle :engine:test --console=plain
          gradle :desktop:test --console=plain

      - name: 编译全模块
        run: gradle build -x test --console=plain

      # 失败时把现场推到一个不保护的分支上，不用登录网页看日志也能定位。
      # 推 ci-artifacts 而不是 main：main 上不该出现这种文件。
      - name: 失败现场
        if: failure()
        run: |
          {
            echo "# CI 失败现场（$(date -u +%Y-%m-%dT%H:%M:%SZ)）"
            echo
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo
            found=0
            for f in $(find . -path '*/build/test-results/*' -name '*.xml' 2>/dev/null); do
              if grep -q '<failure' "$f" 2>/dev/null; then
                found=1
                echo "## $f"
                echo '```'
                sed -n '/<failure/,/<\/failure>/p' "$f" | head -60
                echo '```'
                echo
              fi
            done
            if [ "$found" = "0" ]; then
              echo "没有测试失败记录，说明挂在编译或其他步骤。"
              echo
              echo '```'
              ls -R */build/test-results 2>/dev/null | head -40
              echo '```'
            fi
          } > CI-FAILURE.md
          cat CI-FAILURE.md | head -80
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f CI-FAILURE.md
          git commit -m "ci: 失败现场" || exit 0
          git push origin HEAD:refs/heads/ci-artifacts --force

  portable:
    name: Windows 便携包
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: 补齐 Rhino jar 与运行期 JS 资源
        shell: pwsh
        env:
          # Windows runner 的 Python 默认控制台编码可能是 cp1252，无法输出脚本中的中文日志。
          PYTHONUTF8: '1'
        run: |
          python scripts/fetch-engine-jar.py
          python scripts/fetch-assets.py

      - name: 组装便携目录
        run: gradle :desktop:portable --console=plain

      - name: 打包
        shell: pwsh
        run: Compress-Archive -Path desktop/build/portable/legado-tidy/* -DestinationPath legado-tidy-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: legado-tidy-windows-x64
          path: legado-tidy-windows-x64.zip
          retention-days: 7
