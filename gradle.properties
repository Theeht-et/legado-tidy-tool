# GraalVM 的 native-image 与 Kotlin 2.2 兼容性未验证，暂不做 native 构建；
# 先保证 JVM 版本能跑通，再谈减体积。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 本机 JVM 是桌面环境，不需要 Gradle 的 daemon 保活；CI 里反而要关掉。
org.gradle.daemon=true
# 关掉 configuration cache：Compose 插件与 jlink 工具链在 8.14.4 上还有已知不兼容。
org.gradle.configuration-cache=false
kotlin.incremental=true
# 本机的 Kotlin 编译守护进程在受限环境里连不上（沙箱不给建管道），
# 改成 in-process 编译。代价是单次编译稍慢，但不会再挂死。
kotlin.compiler.execution.strategy=in-process
